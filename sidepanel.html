<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Kindle to PDF</title>
  <link rel="stylesheet" href="sidepanel.css">
  <script src="lib/jspdf.umd.min.js"></script>
</head>
<body>
  <div id="app" class="container">
    <header>
      <h1>📚 Kindle to PDF</h1>
    </header>

    <main>
      <!-- 設定セクション -->
      <section id="settings" class="section">
        <h2>設定</h2>
        <div class="form-group">
          <label for="startPage">開始ページ</label>
          <input type="number" id="startPage" min="1" value="1" class="form-input">
        </div>
        <div class="form-group">
          <label for="endPage">終了ページ</label>
          <input type="number" id="endPage" min="1" value="10" class="form-input">
        </div>
        <div class="form-group">
          <label for="filename">ファイル名（拡張子なし）</label>
          <input type="text" id="filename" placeholder="kindle_book" class="form-input">
        </div>
      </section>

      <!-- コントロールセクション -->
      <section id="controls" class="section">
        <button id="startBtn" class="btn btn-primary">
          <span>▶ スクショ開始</span>
        </button>
        <button id="stopBtn" class="btn btn-danger" disabled>
          <span>⏹ 中止</span>
        </button>
      </section>

      <!-- 進捗セクション -->
      <section id="progress" class="section hidden">
        <div class="progress-text" id="progressText">準備中...</div>
        <div class="progress-bar">
          <div class="progress-fill" id="progressFill"></div>
        </div>
      </section>

      <!-- ステータスセクション -->
      <section id="status" class="section">
        <div id="statusMessage" class="status-message"></div>
      </section>

      <!-- ログセクション -->
      <section id="logs" class="section">
        <h3>ログ</h3>
        <div id="logContainer" class="log-container"></div>
      </section>
    </main>

    <footer>
      <p class="version">v1.0.0</p>
    </footer>
  </div>

  <script src="utils.js"></script>
  <script src="sidepanel.js"></script>
</body>
</html>
