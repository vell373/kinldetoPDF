<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Kindle to PDF - プレビュー</title>
  <link rel="stylesheet" href="preview.css">
</head>
<body>
  <header class="header">
    <h1>プレビュー</h1>
    <div class="toolbar">
      <div class="filename-group">
        <label for="filename">ファイル名</label>
        <input type="text" id="filename" class="filename-input" placeholder="kindle_book">
        <span class="ext">.pdf</span>
      </div>
      <button id="downloadBtn" class="btn-download" disabled>
        PDF をダウンロード
      </button>
    </div>
  </header>

  <div id="statusBar" class="status-bar">読み込み中...</div>

  <main id="imageGrid" class="image-grid"></main>

  <script src="lib/jspdf.umd.min.js"></script>
  <script src="utils.js"></script>
  <script src="preview.js"></script>
</body>
</html>
