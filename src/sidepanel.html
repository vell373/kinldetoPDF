<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Kindle to PDF</title>
  <link rel="stylesheet" href="sidepanel.css">
  <script src="../lib/jspdf.umd.min.js"></script>
</head>
<body>
  <div id="app" class="container">
    <header>
      <h1>Kindle to PDF</h1>
    </header>

    <main>
      <!-- 設定セクション -->
      <section id="settings" class="section section-collapsible">
        <button class="section-toggle" id="settingsToggle">
          <h2>設定</h2>
          <span class="toggle-icon">▼</span>
        </button>
        <div class="section-content" id="settingsContent">
        <div class="form-group">
          <label for="endPage">終了ページ <span class="label-optional">（省略で自動検出）</span></label>
          <input type="number" id="endPage" min="1" placeholder="自動検出" class="form-input">
        </div>
        <div class="form-group">
          <label for="filename">ファイル名（拡張子なし）</label>
          <input type="text" id="filename" placeholder="kindle_book" class="form-input">
        </div>
        <div class="form-group">
          <label>文字起こし AI</label>
          <div class="provider-toggle">
            <button class="provider-btn active" data-provider="claude">Claude</button>
            <button class="provider-btn" data-provider="openai">OpenAI</button>
            <button class="provider-btn" data-provider="gemini">Gemini</button>
          </div>
        </div>
        <div class="form-group">
          <label for="apiKey">
            <span id="apiKeyLabelText">Claude API キー</span>
            <span class="label-optional">（文字起こし機能に必要）</span>
          </label>
          <input type="password" id="apiKey" placeholder="sk-ant-..." class="form-input">
        </div>
        <div class="form-group">
          <label>
            <span id="modelNameLabelText">モデル名</span>
            <span class="label-required">（必須）</span>
          </label>
          <select id="modelSelect" class="form-input">
            <option value="">モデルを選択してください</option>
          </select>
          <div class="model-add-row">
            <input type="text" id="modelNameInput" placeholder="新しいモデル名を入力" class="form-input">
            <button id="modelAddBtn" class="btn btn-small">追加</button>
          </div>
          <button id="modelDeleteBtn" class="btn btn-small btn-danger" disabled>選択中を削除</button>
        </div>
        <div class="form-group">
          <label>開き方向</label>
          <div class="direction-toggle">
            <button id="dirLtr" class="dir-btn active" data-dir="ltr">&#8592; 左開き</button>
            <button id="dirRtl" class="dir-btn" data-dir="rtl">右開き &#8594;</button>
          </div>
        </div>
        </div>
      </section>

      <!-- コントロールセクション -->
      <section id="controls" class="section">
        <button id="startBtn" class="btn btn-primary">
          <span>スクショ開始</span>
        </button>
        <button id="stopBtn" class="btn btn-warning" disabled>
          <span>一時停止</span>
        </button>
        <button id="finishBtn" class="btn btn-danger" disabled>
          <span>終了してプレビュー</span>
        </button>
      </section>

      <!-- 進捗セクション -->
      <section id="progress" class="section hidden">
        <div class="progress-text" id="progressText">準備中...</div>
        <div class="progress-bar">
          <div class="progress-fill" id="progressFill"></div>
        </div>
      </section>

      <!-- ステータスセクション -->
      <section id="status" class="section">
        <div id="statusMessage" class="status-message"></div>
      </section>

      <!-- ログセクション -->
      <section id="logs" class="section">
        <h3>ログ</h3>
        <div id="logContainer" class="log-container"></div>
      </section>
    </main>

    <footer>
      <p class="version">v1.0.0</p>
    </footer>
  </div>

  <script src="utils.js"></script>
  <script src="sidepanel.js"></script>
</body>
</html>
