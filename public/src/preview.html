<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Kindle to PDF - プレビュー</title>
  <link rel="stylesheet" href="preview.css">
</head>
<body>
  <header class="header">
    <h1>プレビュー</h1>
    <div class="toolbar" id="toolbarImages">
      <div class="filename-group">
        <label for="filename">ファイル名</label>
        <input type="text" id="filename" class="filename-input" placeholder="kindle_book">
        <span class="ext">.pdf</span>
      </div>
      <button id="downloadBtn" class="btn-download" disabled>
        PDF をダウンロード
      </button>
    </div>
    <div class="toolbar hidden" id="toolbarTranscription">
      <button id="transcribeBtn" class="btn-transcribe" disabled>
        文字起こし開始
      </button>
      <button id="downloadMdBtn" class="btn-download-md" disabled>
        Markdown をダウンロード
      </button>
    </div>
  </header>

  <div id="statusBar" class="status-bar">読み込み中...</div>

  <!-- タブバー -->
  <div class="tab-bar">
    <button class="tab-btn active" data-tab="images">画像プレビュー</button>
    <button class="tab-btn" data-tab="transcription">文字起こし</button>
  </div>

  <!-- 画像プレビュータブ -->
  <div id="tab-images" class="tab-content">
    <main id="imageGrid" class="image-grid"></main>
  </div>

  <!-- 文字起こしタブ -->
  <div id="tab-transcription" class="tab-content hidden">
    <div class="transcription-progress hidden" id="transcriptionProgress">
      <div class="transcription-progress-bar">
        <div class="transcription-progress-fill" id="transcriptionProgressFill"></div>
      </div>
      <div class="transcription-progress-text" id="transcriptionProgressText">処理中...</div>
    </div>
    <div id="transcriptionResult" class="transcription-result">
      <p class="transcription-placeholder">「文字起こし開始」ボタンを押すと、Claude AI が各ページのテキストを認識します。</p>
    </div>
  </div>

  <script src="../lib/jspdf.umd.min.js"></script>
  <script src="utils.js"></script>
  <script src="preview.js"></script>
</body>
</html>
